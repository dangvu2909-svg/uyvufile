<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐỘ NHẠY SHOP UY VŨ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0202;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Nền đỏ với các đốm sáng nhỏ li ti */
        .bg-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #4a0000 0%, #150000 60%, #050000 100%);
            z-index: -3;
        }

        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #ffcccc;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
            box-shadow: 0 0 6px #ff4d4d, 0 0 10px #ff1a1a;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Canvas pháo hoa trái tim */
        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Khung chính */
        .container {
            background: rgba(20, 0, 0, 0.85);
            border: 2px solid rgba(255, 77, 77, 0.4);
            backdrop-filter: blur(12px);
            padding: 30px 25px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3), inset 0 0 15px rgba(255, 77, 77, 0.2);
            z-index: 10;
        }

        /* Tiêu đề */
        .shop-title {
            font-size: 22px;
            font-weight: 900;
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.8), 0 0 5px #ffffff;
        }

        /* Khu vực nhập thiết bị */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #ff9999;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(40, 0, 0, 0.6);
            border: 1px solid #ff4d4d;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .input-group input:focus {
            border-color: #ff1a1a;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.6), inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Thanh khởi động */
        .launch-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #cc0000, #ff3333);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .launch-btn:hover {
            background: linear-gradient(135deg, #ff0000, #ff6666);
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.7);
            transform: translateY(-2px);
        }

        /* Màn hình kết quả */
        .result-screen {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .device-tag {
            font-size: 14px;
            color: #ff9999;
            margin-bottom: 15px;
        }

        .device-tag span {
            color: #fff;
            font-weight: bold;
        }

        /* 5 thanh hiển thị độ nhạy */
        .bars-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .sens-bar-item {
            background: rgba(30, 0, 0, 0.8);
            border: 1px solid rgba(255, 77, 77, 0.3);
            padding: 10px 12px;
            border-radius: 8px;
        }

        .bar-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
            color: #ffcccc;
        }

        .bar-info span:last-child {
            color: #ff3333;
            font-weight: bold;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff3333, #ff9999);
            border-radius: 3px;
            width: 0%;
            transition: width 1s ease-in-out;
        }

        /* Thanh loading khi bấm khởi động */
        .loading-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background: #ff3333;
            transition: width 1.2s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="stars-container" id="starsContainer"></div>
    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <h1 class="shop-title">ĐỘ NHẠY SHOP UY VŨ</h1>
        
        <!-- Phần nhập liệu -->
        <div id="formSection">
            <div class="input-group">
                <label for="deviceInput">NHẬP TÊN THIẾT BỊ CỦA BẠN:</label>
                <input type="text" id="deviceInput" placeholder="Ví dụ: iPhone, Samsung, OPPO...">
            </div>

            <button class="launch-btn" onclick="startCalibration()">KHỞI ĐỘNG HỆ THỐNG</button>
            
            <div class="loading-bar" id="loadingBar">
                <div class="loading-progress" id="loadingProgress"></div>
            </div>
        </div>

        <!-- Phần hiển thị 5 thanh độ nhạy sau khi khởi động -->
        <div class="result-screen" id="resultScreen">
            <div class="device-tag">Thiết bị: <span id="deviceNameDisplay"></span></div>
            
            <div class="bars-container">
                <!-- Thanh 1 -->
                <div class="sens-bar-item">
                    <div class="bar-info">
                        <span>Nhìn Xung Quanh</span>
                        <span id="val1">0</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" id="fill1"></div></div>
                </div>
                <!-- Thanh 2 -->
                <div class="sens-bar-item">
                    <div class="bar-info">
                        <span>Ống Ngắm Hồng Tâm</span>
                        <span id="val2">0</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" id="fill2"></div></div>
                </div>
                <!-- Thanh 3 -->
                <div class="sens-bar-item">
                    <div class="bar-info">
                        <span>Ống Ngắm 2X</span>
                        <span id="val3">0</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" id="fill3"></div></div>
                </div>
                <!-- Thanh 4 -->
                <div class="sens-bar-item">
                    <div class="bar-info">
                        <span>Ống Ngắm Súng Ngắm</span>
                        <span id="val4">0</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" id="fill4"></div></div>
                </div>
                <!-- Thanh 5 -->
                <div class="sens-bar-item">
                    <div class="bar-info">
                        <span>Nút Camera Tự Do</span>
                        <span id="val5">0</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" id="fill5"></div></div>
                </div>
            </div>

            <button class="launch-btn" style="margin-top: 20px; font-size: 14px; padding: 10px;" onclick="resetForm()">NHẬP LẠI THIẾT BỊ</button>
        </div>
    </div>

    <script>
        // Tạo các đốm sáng li ti lấp lánh ngẫu nhiên ở nền
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animationDuration = `${Math.random() * 3 + 2}s`;
            star.style.animationDelay = `${Math.random() * 2}s`;
            starsContainer.appendChild(star);
        }

        // Xử lý hiệu ứng Pháo hoa nổ hình trái tim trên Canvas
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class HeartParticle {
            constructor(x, y, tx, ty, color) {
                this.x = x;
                this.y = y;
                this.tx = tx;
                this.ty = ty;
                this.color = color;
                this.size = Math.random() * 2 + 1.5;
                this.alpha = 1;
                this.speed = Math.random() * 0.04 + 0.03;
            }

            update() {
                this.x += (this.tx - this.x) * this.speed;
                this.y += (this.ty - this.y) * this.speed;
                if (Math.abs(this.tx - this.x) < 1) {
                    this.alpha -= 0.015;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];
        let animationId = null;

        function triggerHeartFireworks() {
            particles = [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 20;
            const scale = Math.min(canvas.width, canvas.height) / 35;

            for (let t = 0; t < Math.PI * 2; t += 0.05) {
                let hx = 16 * Math.pow(Math.sin(t), 3);
                let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                let targetX = centerX + hx * scale;
                let targetY = centerY + hy * scale;

                let startX = centerX;
                let startY = centerY + 100;

                let colors = ['#ff3366', '#ff4d4d', '#ff9999', '#ff1a75', '#ffffff'];
                let color = colors[Math.floor(Math.random() * colors.length)];

                particles.push(new HeartParticle(startX, startY, targetX, targetY, color));
            }

            if (!animationId) {
                animateFireworks();
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });

            if (particles.length > 0) {
                animationId = requestAnimationFrame(animateFireworks);
            } else {
                animationId = null;
            }
        }

        // Hàm khởi động hệ thống kết hợp pháo hoa hình trái tim
        function startCalibration() {
            const device = document.getElementById('deviceInput').value.trim();
            const loadingBar = document.getElementById('loadingBar');
            const loadingProgress = document.getElementById('loadingProgress');
            
            if (device === "") {
                alert("Vui lòng nhập tên thiết bị của bạn!");
                return;
            }

            loadingBar.style.display = 'block';
            setTimeout(() => { loadingProgress.style.width = '100%'; }, 50);

            // Bắn pháo hoa hình trái tim khi ấn nút
            triggerHeartFireworks();

            setTimeout(() => {
                document.getElementById('formSection').style.display = 'none';
                document.getElementById('deviceNameDisplay').textContent = device;

                // Random giá trị: 
                // Nhìn xung quanh: 100 - 200
                const v1 = Math.floor(Math.random() * (200 - 100 + 1)) + 100; 
                // Các ống ngắm còn lại: 120 - 190
                const v2 = Math.floor(Math.random() * (190 - 120 + 1)) + 120; 
                const v3 = Math.floor(Math.random() * (190 - 120 + 1)) + 120; 
                const v4 = Math.floor(Math.random() * (190 - 120 + 1)) + 120; 
                const v5 = Math.floor(Math.random() * (190 - 120 + 1)) + 120; 

                document.getElementById('val1').textContent = v1;
                document.getElementById('val2').textContent = v2;
                document.getElementById('val3').textContent = v3;
                document.getElementById('val4').textContent = v4;
                document.getElementById('val5').textContent = v5;

                document.getElementById('resultScreen').style.display = 'block';
                loadingBar.style.display = 'none';
                loadingProgress.style.width = '0%';

                // Chạy thanh progress bar tương ứng (quy đổi tối đa 200)
                setTimeout(() => {
                    document.getElementById('fill1').style.width = (v1 / 200 * 100) + '%';
                    document.getElementById('fill2').style.width = (v2 / 200 * 100) + '%';
                    document.getElementById('fill3').style.width = (v3 / 200 * 100) + '%';
                    document.getElementById('fill4').style.width = (v4 / 200 * 100) + '%';
                    document.getElementById('fill5').style.width = (v5 / 200 * 100) + '%';
                }, 100);

            }, 1400);
        }

        function resetForm() {
            document.getElementById('deviceInput').value = '';
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('formSection').style.display = 'block';
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`fill${i}`).style.width = '0%';
            }
        }
    </script>
</body>
</html>
